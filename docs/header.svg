<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="pi-multi-pass">
  <rect width="1200" height="320" fill="#15151b"/>

  <!-- pi glyph -->
  <g fill="#d63084">
    <rect x="62" y="110" width="92" height="18" rx="4"/>
    <path d="M 84 128 h 18 l -5 70 h -18 z"/>
    <path d="M 124 128 h 18 l 5 70 h -18 z"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <text x="182" y="158" font-size="62" font-weight="700" fill="#e8e8ee">pi-multi-pass</text>
    <text x="184" y="200" font-size="23" fill="#9292a2">multiple oauth accounts per provider,</text>
    <text x="184" y="234" font-size="23" fill="#9292a2">rate-limit rotation, pools and chains</text>
  </g>

  <!-- multipass card: per-account headroom -->
  <g>
    <rect x="876" y="56" width="268" height="208" rx="22" fill="#1d1d26"/>

    <circle cx="912" cy="96" r="7" fill="#53b584"/>
    <rect x="932" y="89" width="180" height="14" rx="7" fill="#373746"/>
    <rect x="932" y="89" width="131" height="14" rx="7" fill="#53b584"/>

    <circle cx="912" cy="134" r="7" fill="#e0a63c"/>
    <rect x="932" y="127" width="180" height="14" rx="7" fill="#373746"/>
    <rect x="932" y="127" width="68" height="14" rx="7" fill="#e0a63c"/>

    <circle cx="912" cy="172" r="7" fill="#e05c5c"/>
    <rect x="932" y="165" width="180" height="14" rx="7" fill="#373746"/>
    <rect x="932" y="165" width="22" height="14" rx="7" fill="#e05c5c"/>

    <rect x="900" y="204" width="220" height="38" rx="19" fill="#2b2b38"/>
    <text x="1010" y="230" text-anchor="middle" font-size="21" font-weight="700"
          letter-spacing="3" fill="#d63084"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">MULTIPASS</text>
  </g>
</svg>
